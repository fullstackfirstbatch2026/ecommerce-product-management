services:

  # MySQL database
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommerce_db
    volumes:
      - mysql_data:/var/lib/mysql

  # Spring Boot backend from Docker Hub
  backend:
    image: mjayashree08/ecommerce-management-backend:latest
    container_name: ecommerce-backend
    environment:
      DB_HOST: mysql
      DB_NAME: ecommerce_db
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "8080:8080"
    depends_on:
      - mysql

  # React frontend from Docker Hub
  frontend:
    image: mjayashree08/ecommerce-management-frontend:latest
    container_name: ecommerce-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data: